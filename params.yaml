pipeline_control:
  log_to_mlflow: false

data_transformation:
  physics_mode: "full"

model_training:
  # Options: ExtraTrees, RandomForest, DecisionTree, LinearRegression, Ridge, Lasso, 
  # KNeighbors, GradientBoosting, XGBoost, SVR, NeuralNetwork
  model_name: "NeuralNetwork"  
  hyperparameter_tuning: true
  
  hyperparameters:
    ExtraTrees:
      n_estimators: [50, 100, 200, 300, 500]
      max_depth: [null, 10, 20, 30, 40, 50]
      min_samples_split: [2, 5, 10, 15]
      min_samples_leaf: [1, 2, 4, 8]
      bootstrap: [true, false]
      
    RandomForest:
      n_estimators: [50, 100, 200, 300, 500]
      max_depth: [null, 10, 20, 30, 40, 50]
      min_samples_split: [2, 5, 10, 15]
      min_samples_leaf: [1, 2, 4, 8]
      bootstrap: [true, false]

    DecisionTree:
      max_depth: [null, 10, 20, 30, 40, 50]
      min_samples_split: [2, 5, 10, 20]
      min_samples_leaf: [1, 2, 4, 8, 16]

    LinearRegression: {}  # No hyperparameters to tune

    Ridge:
      alpha: [0.01, 0.1, 1.0, 10.0, 100.0, 500.0]
      solver: ['auto', 'svd', 'cholesky', 'lsqr', 'sag']

    Lasso:
      estimator__alpha: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
      estimator__selection: ['cyclic', 'random']

    KNeighbors:
      n_neighbors: [3, 5, 7, 9, 11, 15]
      weights: ['uniform', 'distance']
      p: [1, 2] # 1=Manhattan distance, 2=Euclidean distance

    GradientBoosting:
      estimator__n_estimators: [50, 100, 200, 300, 500]
      estimator__learning_rate: [0.001, 0.01, 0.05, 0.1, 0.2]
      estimator__max_depth: [3, 4, 5, 7, 9]
      estimator__subsample: [0.6, 0.8, 1.0]

    XGBoost:
      n_estimators: [100, 200, 300, 500, 1000]
      learning_rate: [0.001, 0.01, 0.05, 0.1, 0.2, 0.3]
      max_depth: [3, 5, 7, 9, 12]
      subsample: [0.6, 0.8, 1.0]
      colsample_bytree: [0.6, 0.8, 1.0]
      gamma: [0, 0.1, 0.2, 0.5]

    SVR:
      estimator__C: [0.1, 1.0, 10.0, 100.0]
      estimator__kernel: ['linear', 'rbf', 'poly']
      estimator__gamma: ['scale', 'auto', 0.1, 0.01]

    NeuralNetwork:
      epochs: [50, 100, 150, 200]
      batch_size: [16, 32, 64, 128]
      learning_rate: [0.0005, 0.001, 0.005, 0.01]
      neurons_layer_1: [64, 128, 256, 512]
      neurons_layer_2: [32, 64, 128, 256]
      dropout_rate: [0.0, 0.1, 0.2, 0.3, 0.4]
      use_batch_norm: [true, false]
      optimizer: ['adam', 'rmsprop', 'sgd']
      loss: ['mse', 'mae', 'huber']