pipeline_control:
  log_to_mlflow: true

data_transformation:
  physics_mode: "full"

model_training:
  # Options: ExtraTrees, RandomForest, DecisionTree, LinearRegression, Ridge, Lasso, 
  # KNeighbors, GradientBoosting, XGBoost, SVR, NeuralNetwork
  model_name: "NeuralNetwork"  
  hyperparameter_tuning: false
  
  hyperparameters:
    ExtraTrees:
      n_estimators: [50, 100, 200]
      max_depth: [null, 10, 20, 30]
      min_samples_split: [2, 5, 10]
      
    RandomForest:
      n_estimators: [50, 100, 200]
      max_depth: [null, 15, 25]
      min_samples_split: [2, 5]

    DecisionTree:
      max_depth: [null, 10, 20, 50]
      min_samples_split: [2, 5, 10]

    LinearRegression: {}  # No hyperparameters to tune

    Ridge:
      alpha: [0.1, 1.0, 10.0, 100.0]

    Lasso:
      estimator__alpha: [0.1, 1.0, 10.0]  # Uses 'estimator__' due to MultiOutputRegressor wrapper

    KNeighbors:
      n_neighbors: [3, 5, 7, 9]
      weights: ['uniform', 'distance']

    GradientBoosting:
      estimator__n_estimators: [50, 100, 200]
      estimator__learning_rate: [0.01, 0.1, 0.2]
      estimator__max_depth: [3, 5, 7]

    XGBoost:
      n_estimators: [50, 100, 200]
      learning_rate: [0.01, 0.1, 0.2]
      max_depth: [3, 5, 7]

    SVR:
      estimator__C: [0.1, 1.0, 10.0]
      estimator__kernel: ['linear', 'rbf']

    NeuralNetwork:
      epochs: [20, 50]
      batch_size: [16, 32]
      learning_rate: [0.001, 0.01]
      neurons_layer_1: [64, 128]
      neurons_layer_2: [32, 64]